import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Kredensial rilis dibaca dari keystore.properties. Kalau berkasnya tidak ada,
// build release tetap jalan tapi APK-nya tidak ditandatangani — kegagalan
// penandatanganan tidak pernah diam-diam.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseKeystore = keystoreProperties['storeFile'] != null &&
        rootProject.file(keystoreProperties['storeFile']).exists()

android {
    namespace 'com.aldef.system'
    compileSdk 35

    defaultConfig {
        applicationId "com.aldef.system"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        vectorDrawables {
            useSupportLibrary true
        }

        // Aplikasi ini hanya dipasang di ponsel, jadi pustaka native x86 milik
        // ML Kit (sekitar 12 MB) tidak perlu ikut. Hapus blok ini kalau suatu
        // saat mau dijalankan di emulator x86.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 dimatikan: ML Kit bersandar pada refleksi dan pengecilan kode
            // gampang memutusnya diam-diam.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    lint {
        // Aplikasi pribadi: peringatan lint tidak boleh menghentikan build APK.
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    // FragmentActivity dibutuhkan BiometricPrompt.
    implementation 'androidx.fragment:fragment-ktx:1.8.5'

    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'

    implementation 'androidx.navigation:navigation-compose:2.8.5'

    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    implementation 'androidx.biometric:biometric:1.1.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'com.google.accompanist:accompanist-permissions:0.36.0'

    implementation 'androidx.core:core-splashscreen:1.0.1'

    implementation 'com.google.android.gms:play-services-location:21.3.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
